<!doctype html>
<html lang="el">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Εκτός Σύνδεσης &middot; 1ο ΓΕΛ Ραφήνας</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            color: #334155;
            text-align: center;
            padding: 1.5rem;
            box-sizing: border-box;
        }
        .card {
            max-width: 22rem;
        }
        .badge {
            width: 4rem;
            height: 4rem;
            border-radius: 9999px;
            background: #0e6e73;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
        }
        .badge span {
            width: 3rem;
            height: 3rem;
            border-radius: 9999px;
            background: #fff;
            border: 3px solid #f2952b;
            color: #f2952b;
            font-weight: 800;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1 {
            font-size: 1.15rem;
            margin: 0 0 0.5rem;
            color: #0f172a;
        }
        p {
            font-size: 0.9rem;
            line-height: 1.5;
            margin: 0 0 1.25rem;
        }
        button {
            background: #0e6e73;
            color: #fff;
            border: none;
            border-radius: 0.5rem;
            padding: 0.6rem 1.25rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #0c5b60;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge"><span>1ο</span></div>
        <h1>Είστε εκτός σύνδεσης</h1>
        <p>Δεν υπάρχει σύνδεση στο internet αυτή τη στιγμή. Ελέγξτε τη σύνδεσή σας και δοκιμάστε ξανά.</p>
        <button onclick="location.reload()">Δοκιμή ξανά</button>
    </div>
</body>
</html>
